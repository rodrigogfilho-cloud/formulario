<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Inputs</title>
</head>
<style>
    * {
        margin-bottom: 20px;
    }



    input {
        text-transform: uppercase;
        color: blueviolet;
        border: 3px solid greenyellow;
        background-color: rgb(247, 178, 178);
        /* display: block; */

    }

    button {
        padding: 20px 10px;
        background-color: aqua;
        color: slateblue;
        border: 1px solid aqua;
        border-radius: 15px;


    }
</style>

<body>

    <img src="https://placehold.co/200x200?text=Foto Perfil" alt="teste" />


    <h1>Entrar</h1>

    <form action="/enviar.html" method="POST">
        <label for="cpf">Documento Identificação</label><br/>
        <input type="number" id="cpf" name="cpf" value=""  placeholder="Digite seu CPF" /><br/>

        <label for="senha">Senha:</label><br/>
        <input type="password" id="senha" name="senha"  value="" placeholder="Digite sua senha" />

        <hr />
        <h2>Botões utilizando a TAG !BUTTON!</h2>
        <button>Entrar</button> <!-- Pelo de fato de ser um button dentro do form, ele se torna tipo=submit automaticamente. -->
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <hr />
        <h2>Botões utilizando a TAG !INPUT!</h2>
        <input type="button" value="Entrar" />  <!-- Pelo de fato de ser um input tipo: button, ele não tem função nenhuma. -->
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
    </form>


</body>

</html>
