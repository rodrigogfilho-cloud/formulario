<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Inputs</title>
</head>
<style>
    * {
        margin-bottom: 20px;
    }



    input {
        text-transform: uppercase;
        color: blueviolet;
        border: 3px solid greenyellow;
        background-color: rgb(247, 178, 178);
        /* display: block; */

    }

    button {
        padding: 20px 10px;
        background-color: aqua;
        color: slateblue;
        border: 1px solid aqua;
        border-radius: 15px;


    }

  
</style>

<body>

    <img src="https://placehold.co/200x200?text=Foto Perfil" alt="teste" />


    <h1>Entrar</h1>

    <form action="/enviar.html" method="get">
        <label for="cpf">Documento Identificação</label><br/>
        <input type="text" id="cpf" name="cpf" value=""  placeholder="Informe seu CPF" maxlength="11" required/><br/>

        <label for="senha">Senha:</label><br/>
        <input type="password" id="senha" name="senha"  value="" placeholder="Digite sua senha"    required/>

        <hr />
        <h2>Botões utilizando a TAG !BUTTON!</h2>
        <button>Entrar</button> <!-- Pelo de fato de ser um button dentro do form, ele se torna tipo=submit automaticamente. -->
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <hr />
        <h2>Botões utilizando a TAG !INPUT!</h2>
        <input type="button" value="Entrar" />  <!-- Pelo de fato de ser um input tipo: button, ele não tem função nenhuma. -->
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
        <hr>

        <h2>Selecione sua linguagem favorita</h2>
        

        <input type="radio" id="html" name="option" value="HTML"/>
        <label for="html">HTML</label>

        <input type="radio" id="py" name="option" value="Python"/>
        <label for="py">Python</label>

        <input type="radio" id="JS" name="option" value="JavaScript"/>
        <label for="JS">JavaScript</label>

        <hr>

        <h2>Quais dias da semana você treina</h2>

        <input type="checkbox" id="segunda" value="segunda-feira"/>
        <label for="html">segunda-feira</label>

        <input type="checkbox" id="terca" value="terça-feira"/>
        <label for="py">terça-feira</label>

        <input type="checkbox" id="quarta"  value="quarta-feira"/>
        <label for="JS">quarta-feira</label>

        <input type="checkbox" id="quinta" value="quinta-feira"/>
        <label for="py">quinta-feira</label>

        <input type="checkbox" id="sexta"value="sexta-feira"/>
        <label for="JS">sexta-feira</label>


    

    </form>



</body>

</html>
